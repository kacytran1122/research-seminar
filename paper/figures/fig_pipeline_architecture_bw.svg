<text x="367" y="280" text-anchor="middle" font-size="14">Photon branch</text>
<text x="367" y="298" text-anchor="middle" font-size="14">MLP + dropout</text>
<rect class="box" x="530" y="178" width="165" height="75" rx="8"/>
<text x="612" y="208" text-anchor="middle" font-size="14">Fusion operator</text>
<text x="612" y="226" text-anchor="middle" font-size="14">concat / product / average / gate</text>
<rect class="box" x="775" y="178" width="165" height="75" rx="8"/>
<text x="857" y="208" text-anchor="middle" font-size="14">Classifier head</text>
