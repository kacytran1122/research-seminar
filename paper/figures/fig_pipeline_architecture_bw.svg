<text x="127" y="135" text-anchor="middle" font-size="14">Sentinel-2 RGB</text>
<text x="127" y="153" text-anchor="middle" font-size="14">128x128 chips</text>
<rect class="box" x="45" y="250" width="165" height="75" rx="8"/>
<text x="127" y="280" text-anchor="middle" font-size="14">ICESat-2 photons</text>
<text x="127" y="298" text-anchor="middle" font-size="14">10 tabular features</text>
<rect class="box" x="285" y="105" width="165" height="75" rx="8"/>
<text x="367" y="135" text-anchor="middle" font-size="14">Image branch</text>
<text x="367" y="153" text-anchor="middle" font-size="14">spatial encoder</text>
