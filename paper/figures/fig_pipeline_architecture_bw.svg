<line x1="210" y1="142" x2="285" y2="142" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="210" y1="287" x2="285" y2="287" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="450" y1="142" x2="530" y2="205" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="450" y1="287" x2="530" y2="215" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="695" y1="215" x2="775" y2="215" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530" y="330" font-size="13">Held-out evaluation: accuracy, macro-F1, balanced accuracy, kappa, calibration, confusion matrix</text>
