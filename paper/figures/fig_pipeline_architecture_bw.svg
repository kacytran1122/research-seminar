<svg xmlns="http://www.w3.org/2000/svg" width="980" height="370" viewBox="0 0 980 370">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000} .box{fill:#fff;stroke:#000;stroke-width:2} .thin{stroke:#000;stroke-width:1} .dash{stroke:#000;stroke-width:1;stroke-dasharray:4 3} .bar{fill:#000} .hatch{fill:#fff;stroke:#000;stroke-width:1.5} </style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker></defs>
<text x="45" y="42" font-size="22" font-weight="700">Paired multimodal remote-sensing fusion pipeline</text>
