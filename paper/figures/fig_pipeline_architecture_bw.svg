<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="380" viewBox="0 0 1060 380">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827} .grid{stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 3}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
<text x="45" y="42" font-size="22" font-weight="700">Paired multimodal remote-sensing fusion pipeline</text>
<rect x="45" y="105" width="190" height="82" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="4"/>
<text x="140" y="137" text-anchor="middle" font-size="14" font-weight="700">Sentinel-2 RGB</text>
<text x="140" y="163" text-anchor="middle" font-size="13">128 x 128 chips</text>
<rect x="45" y="250" width="190" height="82" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="4"/>
<text x="140" y="282" text-anchor="middle" font-size="14" font-weight="700">ICESat-2 photons</text>
<text x="140" y="308" text-anchor="middle" font-size="13">10 tabular features</text>
<rect x="305" y="105" width="190" height="82" rx="12" fill="#f8fafc" stroke="#0ea5e9" stroke-width="4"/>
<text x="400" y="137" text-anchor="middle" font-size="14" font-weight="700">Image branch</text>
<text x="400" y="163" text-anchor="middle" font-size="13">spatial encoder</text>
<rect x="305" y="250" width="190" height="82" rx="12" fill="#f8fafc" stroke="#22c55e" stroke-width="4"/>
<text x="400" y="282" text-anchor="middle" font-size="14" font-weight="700">Photon branch</text>
<text x="400" y="308" text-anchor="middle" font-size="13">MLP + dropout</text>
<rect x="585" y="178" width="190" height="82" rx="12" fill="#f8fafc" stroke="#f97316" stroke-width="4"/>
<text x="680" y="210" text-anchor="middle" font-size="14" font-weight="700">Fusion operator</text>
<text x="680" y="236" text-anchor="middle" font-size="13">concat / product / average / gate</text>
<rect x="835" y="178" width="190" height="82" rx="12" fill="#f8fafc" stroke="#9333ea" stroke-width="4"/>
<text x="930" y="210" text-anchor="middle" font-size="14" font-weight="700">Classifier head</text>
<text x="930" y="236" text-anchor="middle" font-size="13">3-class output</text>
<line x1="235" y1="146" x2="305" y2="146" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="235" y1="291" x2="305" y2="291" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="495" y1="146" x2="585" y2="219" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="495" y1="291" x2="585" y2="219" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="775" y1="219" x2="835" y2="219" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
<text x="585" y="340" font-size="13">Held-out evaluation: accuracy, macro-F1, balanced accuracy, kappa, calibration, confusion matrix</text>
